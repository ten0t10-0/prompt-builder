title: Prompt Builder

lists:
  colors:
    - Red
    - Blue
    - Green
    - Black
    - White
  finishes:
    - Matte
    - Glossy
    - Metallic
  places:
    - Studio
    - Forest
    - Street

tabs:
  # Preset buttons live here. Footer hidden via no_reset (opt-out demo).
  - name: Presets
    type: tab
    no_reset: true
    children:
      - type: preset
        name: Portrait Base
        mode: global
        children:
          - type: set
            name: Subject
            prompt: 1girl
          - type: set
            name: Lighting
            edit: 0.8
          - type: set
            name: Wardrobe
            children:
              - type: value
                name: Black clothes
      - type: preset
        name: Quick Polish
        mode: partial
        children:
          - type: set
            name: Detail
            prompt: highly detailed
            emphasis: 1.1
          - type: set
            name: Palette Link
            activated: true
          - type: set
            name: Wardrobe
            children:
              - type: value
                name: Formal
                emphasis: 1.2
      - type: preset
        name: Warm Shift
        mode: additive
        children:
          - type: set
            name: Lighting
            edit: 0.9
          - type: set
            name: Skin Tone
            prompt: warm skin

  - name: Subject
    type: tab
    children:
      - type: single
        name: Subject
        prompt: 1girl
        activated: true
      - type: single
        name: Detail
        prompt: detailed
      - type: separator
      - type: edit
        name: Skin Tone
        prompt_a: pale skin
        prompt_b: tanned skin
        edit: 0.4
      - type: dual
        name: Hair
        prompt_pos: long hair
        prompt_neg: short hair
        emphasis_neg: 0.8
        postfix: hairstyle
      - type: separator
      # Default sorted select: list options interleave with singles.
      - type: select
        name: Wardrobe
        open: true
        children:
          - type: from_list
            name: colors
            postfix: clothes
          - type: single
            name: Formal
            prompt: formal clothes
          - type: single
            name: Overalls
            prompt: overalls
      # sort:false keeps layout order; list items stay sorted in place.
      - type: select
        name: Footwear
        sort: false
        children:
          - type: single
            name: Boots
            prompt: boots
          - type: single
            name: Sneakers
            prompt: sneakers
          - type: single
            name: Sandals
            prompt: sandals
      - type: select
        name: Finish
        children:
          - type: from_list
            name: finishes

  - name: Style
    type: tab
    children:
      # Accordion expanded by default (open defaults to true).
      - type: accordion
        name: Color
        children:
          - type: edit
            name: Palette
            prompt_a: muted colors
            prompt_b: vivid colors
            edit: 0.6
          - type: edit_link
            name: Palette Link
            link: Palette
            prompt_a: soft tones
            prompt_b: bold tones
      - type: accordion
        name: Texture
        open: false
        children:
          - type: edit
            name: Grain
            prompt_a: smooth
            prompt_b: grainy
            edit: 0.3
          - type: single
            name: Vignette
            prompt: vignette
      - type: group
        name: Framing
        children:
          - type: dual
            name: Composition
            prompt_pos: centered composition
            prompt_neg: cropped edges
          # Negative single: lands in the negative prompt when active.
          - type: single
            name: Watermark
            prompt: watermark
            is_negative: true
            activated: true
      - type: separator
      # Nested sub-tab with a row/column layout inside.
      - type: tab
        name: Advanced
        children:
          - type: row
            children:
              - type: column
                children:
                  - type: edit
                    name: Depth
                    prompt_a: shallow depth
                    prompt_b: deep depth
                    edit: 0.5
              - type: column
                children:
                  - type: edit
                    name: Motion
                    prompt_a: static
                    prompt_b: dynamic
                    edit: 0.5

  - name: Scene
    type: tab
    children:
      # Select-level prefix applies to every option prompt.
      - type: select
        name: Backdrop
        prefix: in
        children:
          - type: from_list
            name: places
      - type: dual
        name: Weather
        prompt_pos: sunny
        prompt_neg: rainy
        prefix: outdoor
      - type: single
        name: Cinematic
        prompt: cinematic lighting
        emphasis: 1.1
      - type: separator
      - type: edit
        name: Lighting
        prompt_a: soft light
        prompt_b: harsh light
        edit: 0.5
      - type: edit
        name: Time
        prompt_a: morning light
        prompt_b: night lights
        edit: 0.5
